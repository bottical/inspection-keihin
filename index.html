<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検品アプリ</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="app.js" defer></script>
</head>

    
<body data-page="registration">
    <h1>CSV登録</h1>
    <input type="file" id="csvFileInput" accept=".csv" />
    <label>
        <input type="checkbox" id="includeHeader" checked> ヘッダーを含む
    </label>
    <div>
        <!-- <label><input type="radio" name="encoding" value="UTF-8" checked> UTF-8</label> -->
        <label><input type="radio" name="encoding" value="Shift-JIS" checked> Shift JIS</label>
    </div>
    <button onclick="importCSV()">CSVからインポート</button>

    <div id="statusMessage"></div>

        <!-- 検品ページへのリンク -->
    <div style="margin-top: 20px;">
        <a href="inspection.html" class="button-link">検品ページへ移動</a>
    </div>
    <br>
<!-- CSVバッチ一覧表示エリア -->
<section id="batchSearchSection">
    <div class="batch-section-header">
        <h3>過去バッチの進捗・CSV出力</h3>
        <button type="button" id="batchToggleButton" class="batch-toggle">開く</button>
    </div>
    <p>CSV投入（バッチ）単位で、過去の検品進捗を確認できます。表示したバッチはCSVとしてダウンロードできます。</p>
    <div id="batchPanel" class="batch-panel" style="display:none;">
        <div class="batch-search-controls">
            <div class="batch-search-inputs">
                <label>
                    開始日
                    <input type="date" id="batchStartDate">
                </label>
                <span class="batch-range-separator">〜</span>
                <label>
                    終了日
                    <input type="date" id="batchEndDate">
                </label>
                <button type="button" id="batchSearchButton">検索</button>
            </div>
            <div class="batch-search-presets">
                <button type="button" id="batchTodayButton">今日</button>
                <button type="button" id="batchYesterdayButton">昨日</button>
                <button type="button" id="batchLast7DaysButton">直近7日</button>
                <button type="button" id="batchLatestButton">最新を表示</button>
            </div>
        </div>
        <div id="batchListContainer"><p>「開く」を押すと読み込みます。</p></div>
        <div class="batch-show-more">
            <button type="button" id="batchShowMoreButton" style="display: none;">さらに表示</button>
        </div>
    </div>
</section>

<!-- ページ本体の進捗表示用 -->
<div id="progressContainer"></div>

<button id="progressCheckButton">進捗確認</button>


<!-- 検品進捗モーダル -->
<div id="progressModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>
        <div id="progressContainerModal"></div>
    </div>
</div>






    
<div id="loginContainer">
    <input type="email" id="emailInput" placeholder="メールアドレス">
    <input type="password" id="passwordInput" placeholder="パスワード">
    <button id="loginButton">ログイン</button>
</div>

<div id="userInfo" style="display: none;">
    <p id="welcomeMessage"></p>
    <button id="logoutButton" style="display: none;">ログアウト</button>
</div>

    
</body>
</html>
